<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNEXA | Online Mağaza</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#171923}
header{background:#111827;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:32px;letter-spacing:4px}
header p{color:#cbd5e1;margin-bottom:0}
.search{padding:20px 16px}
.search input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
h2{padding:0 16px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px}
.card{background:white;border-radius:15px;padding:14px;box-shadow:0 3px 12px #0000000b}
.photo{height:110px;background:#eef0f7;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:48px}
.card h3{font-size:16px}
.price{font-size:18px;font-weight:bold}
button{background:#111827;color:white;border:0;padding:12px 8px;border-radius:9px;width:100%;font-size:14px}
footer{text-align:center;padding:25px;color:#666}
#cart{text-align:center;padding:10px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>LUNEXA</h1>
<p>Tarzını keşfet, farkını ortaya koy.</p>
</header>

<div class="search">
<input id="search" placeholder="Ürün ara..." oninput="filterProducts()">
</div>

<div id="cart">🛒 Sepetim: <span id="count">0</span> ürün</div>

<h2>✨ Öne Çıkan Ürünler</h2>
<div class="products" id="products">
<div class="card">
<div class="photo">🎧</div>
<h3>Kablosuz Kulaklık</h3>
<p class="price">499 TL</p>
<button onclick="addCart()">Sepete Ekle</button>
</div>
<div class="card">
<div class="photo">⌚</div>
<h3>Akıllı Saat</h3>
<p class="price">799 TL</p>
<button onclick="addCart()">Sepete Ekle</button>
</div>
<div class="card">
<div class="photo">🎒</div>
<h3>Günlük Sırt Çantası</h3>
<p class="price">399 TL</p>
<button onclick="addCart()">Sepete Ekle</button>
</div>
<div class="card">
<div class="photo">🔊</div>
<h3>Bluetooth Hoparlör</h3>
<p class="price">599 TL</p>
<button onclick="addCart()">Sepete Ekle</button>
</div>
</div>

<footer>
<p>© 2026 LUNEXA</p>
<p>Online alışveriş dünyana hoş geldin!</p>
</footer>

<script>
let count=0;
function addCart(){
count++;
document.getElementById('count').textContent=count;
}
function filterProducts(){
let q=document.getElementById('search').value.toLocaleLowerCase('tr');
document.querySelectorAll('.card').forEach(card=>{
card.style.display=card.innerText.toLocaleLowerCase('tr').includes(q)?'block':'none';
});
}
</script>
</body>
  </html>
